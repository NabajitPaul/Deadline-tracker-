<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Save job — Deadline Tracker</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css">
<meta name="theme-color" content="#0B0D12">
</head>
<body>
  <div class="wrap" style="max-width:480px;">
    <div class="share-hero">
      <div class="badge">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0B0D12" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
      </div>
      <h1 style="font-size:17px;">Save this job</h1>
      <p style="color:#8B93A7; font-size:12.5px; margin-top:4px;">Check the details below — edit anything that's missing, then save.</p>
    </div>

    <div class="share-card">
      <label class="field-label">Exam / Job Name</label>
      <input id="f-name" class="field-input" placeholder="e.g. IBPS PO 2026">

      <label class="field-label">Last Date for Form Fill-up</label>
      <input id="f-date" type="date" class="field-input">
      <div id="date-hint" style="font-size:11px; color:#F97316; margin:-8px 0 12px; display:none;">
        Couldn't find a date automatically — please pick it.
      </div>

      <label class="field-label">Official Notification / Application Link</label>
      <input id="f-link" class="field-input" placeholder="https://…">

      <button id="save-btn" class="btn btn-primary" style="width:100%; justify-content:center;">
        Save to Tracker
      </button>
      <a href="./index.html" class="btn btn-ghost" style="width:100%; justify-content:center; margin-top:10px; box-sizing:border-box;">
        Cancel — open tracker
      </a>
    </div>

    <p class="footer-note">
      Tip: next time, long-press and select the "last date" line on the page before tapping Share —
      it helps the date get picked up automatically.
    </p>
  </div>

  <script src="shared.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const sharedTitle = params.get('title') || '';
    const sharedText = params.get('text') || '';
    const sharedUrl = params.get('url') || '';
    const blob = [sharedTitle, sharedText, sharedUrl].filter(Boolean).join('\n');

    // name: prefer title, else first line of text
    let name = sharedTitle.trim();
    if (!name && sharedText) name = sharedText.split('\n')[0].trim();
    document.getElementById('f-name').value = name.slice(0, 140);

    // link: prefer explicit url param, else a URL found inside text
    let link = sharedUrl.trim();
    if (!link) {
      const m = sharedText.match(/https?:\/\/[^\s)]+/i);
      if (m) link = m[0];
    }
    document.getElementById('f-link').value = link;

    // date: search combined blob
    const found = parseDateFromText(blob);
    if (found) {
      document.getElementById('f-date').value = toInputDate(found);
    } else {
      document.getElementById('date-hint').style.display = 'block';
    }

    document.getElementById('save-btn').addEventListener('click', () => {
      const nameVal = document.getElementById('f-name').value.trim();
      const dateVal = document.getElementById('f-date').value;
      const linkVal = document.getElementById('f-link').value.trim();
      if (!nameVal || !dateVal) {
        alert('Please fill in the job name and last date.');
        return;
      }
      addJob({
        id: makeId(),
        name: nameVal,
        lastDate: dateVal,
        link: linkVal,
        category: detectCategory(nameVal),
        applied: false,
        createdAt: new Date().toISOString()
      });
      location.href = './index.html?saved=1';
    });
  </script>
</body>
</html>
